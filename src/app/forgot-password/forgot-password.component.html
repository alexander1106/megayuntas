<div class="min-h-screen flex items-center justify-center bg-[#F6F8FB] px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <!-- Header -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-800">
        Recuperar contraseña
      </h2>
      <p class="mt-2 text-sm text-gray-500">
        Te enviaremos un enlace de recuperación a tu correo.
      </p>
    </div>

    <!-- Form -->
    <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" class="space-y-6">

      <!-- Input -->
      <div class="relative">
        <iconify-icon
          icon="mdi:email-outline"
          width="22"
          height="22"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
        ></iconify-icon>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="Correo electrónico"
          class="w-full pl-12 pr-4 py-3 rounded-xl bg-gray-100 text-gray-800
                 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#00A89D]/40
                 transition"
        />
      </div>

      <!-- Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3 rounded-xl text-white font-semibold
               bg-[#00A89D] hover:bg-[#009387]
               transition disabled:opacity-60 disabled:cursor-not-allowed
               flex items-center justify-center gap-2"
      >
        <svg
          *ngIf="loading"
          class="animate-spin h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          />
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
          />
        </svg>

        <span>{{ loading ? 'Enviando enlace...' : 'Enviar enlace' }}</span>
      </button>
    </form>

    <!-- Back -->
    <div class="mt-8 text-center">
      <button
        (click)="goToLogin()"
        class="text-sm text-gray-500 hover:text-[#00A89D] transition"
      >
        ← Volver al inicio de sesión
      </button>
    </div>
  </div>
</div>
